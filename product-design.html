  /* Restores the user's last-chosen theme before first paint, so
     navigating between pages doesn't flash light and then flip to dark.

     script.js, which loads at the end of body — too late to prevent the

    <!-- Real client-side encryption gate (see initEncryptedGates in
         script.js) — unlike a plain hide/show gate, the actual case-study
         markup below never ships in the page source in readable form: it's
         AES-GCM ciphertext, embedded in the <script type="application/json">
         block right after this gate, decryptable only with the correct
         password. #project-content starts empty; script.js fills it in
         after a successful decrypt. -->

      <form class="password-gate-form">
        <input type="password" placeholder="Password" autocomplete="off" required>
        <button type="submit">Unlock</button>
      </form>
      <p class="password-gate-error" hidden>Incorrect password.</p>
    </div>
