<meta name="theme-color" content="#F8F3EA" id="theme-color-meta">
<script>
  /* Restores the user's last-chosen theme before first paint, so
     navigating between pages doesn't flash light and then flip to dark.
     Runs as an inline, render-blocking script in <head> (not from
     script.js, which loads at the end of body — too late to prevent the
     flash) and only needs to handle the dark case, since every page's
     <html> already ships with class="light" as its default. */
  (function(){
    try{
      if(localStorage.getItem('theme') === 'dark'){
        document.documentElement.classList.remove('light');
        var tc = document.getElementById('theme-color-meta');
        if(tc) tc.setAttribute('content', '#0E0E0E');
      }
    }catch(e){}
  })();
</script>
